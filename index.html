<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Damon Vane Themes</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0e14;
            color: #ffffff;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-user-select: none;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 20px;
            margin: 0 0 8px 0;
            font-weight: 600;
        }
        .header p {
            font-size: 14px;
            color: #707579;
            margin: 0;
        }
        .section {
            width: 100%;
            background-color: #151f2d;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-sizing: border-box;
        }
        .section-title {
            font-size: 12px;
            color: #3b82f6;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }
        .color-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #1e2c3e;
        }
        .color-row:last-child {
            border-bottom: none;
        }
        .color-label {
            font-size: 15px;
        }
        .color-input-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .color-value {
            font-size: 14px;
            color: #8e969e;
            font-family: monospace;
        }
        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch {
            border: 2px solid #ffffff33;
            border-radius: 50%;
        }
        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .radio-row {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 15px;
            cursor: pointer;
        }
        input[type="radio"] {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid #8e969e;
            border-radius: 50%;
            outline: none;
            background-color: transparent;
            display: grid;
            place-content: center;
        }
        input[type="radio"]::before {
            content: "";
            width: 10px;
            height: 10px;
            border-radius: 50%;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            background-color: #3b82f6;
        }
        input[type="radio"]:checked {
            border-color: #3b82f6;
        }
        input[type="radio"]:checked::before {
            transform: scale(1);
        }
        .slider-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .slider-header {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #8e969e;
        }
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: #243447;
            border-radius: 2px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            transition: transform 0.1s;
        }
        input[type="range"]::-webkit-slider-thumb:active {
            transform: scale(1.2);
        }
        .btn-main {
            width: 100%;
            background-color: #3b82f6;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            transition: background-color 0.2s;
        }
        .btn-main:active {
            background-color: #2563eb;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Редактор цветов</h1>
        <p>Измените цвета в вашей теме</p>
    </div>

    <!-- Раздел выбора цветов -->
    <div class="section">
        <div class="section-title">Цвета интерфейса</div>
        
        <div class="color-row">
            <span class="color-label">Цвет фона чата</span>
            <div class="color-input-wrapper">
                <span class="color-value" id="val-bg">#0b0e14</span>
                <input type="color" id="color-bg" value="#0b0e14">
            </div>
        </div>

        <div class="color-row">
            <span class="color-label">Цвет текста сообщений</span>
            <div class="color-input-wrapper">
                <span class="color-value" id="val-text">#ffffff</span>
                <input type="color" id="color-text" value="#ffffff">
            </div>
        </div>

        <div class="color-row">
            <span class="color-label">Второстепенный цвет</span>
            <div class="color-input-wrapper">
                <span class="color-value" id="val-accent">#3b82f6</span>
                <input type="color" id="color-accent" value="#3b82f6">
            </div>
        </div>
    </div>

    <!-- Раздел выбора устройства -->
    <div class="section">
        <div class="section-title">Выберите устройство</div>
        <div class="radio-group">
            <label class="radio-row">
                <input type="radio" name="device" value="android" checked>
                <span>Android</span>
            </label>
            <label class="radio-row">
                <input type="radio" name="device" value="ios">
                <span>iOS</span>
            </label>
            <label class="radio-row">
                <input type="radio" name="device" value="desktop">
                <span>Telegram Desktop</span>
            </label>
        </div>
    </div>

    <!-- Раздел прозрачности -->
    <div class="section">
        <div class="section-title">Прозрачность сообщений</div>
        <div class="slider-wrapper">
            <div class="slider-header">
                <span>Уровень прозрачности</span>
                <span id="val-opacity">100%</span>
            </div>
            <input type="range" id="slider-opacity" min="10" max="100" value="100">
        </div>
    </div>

    <button class="btn-main" id="btn-create">Создать тему</button>

    <script src="script.js"></script>
</body>
</html>
